name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      - run: bun publish
        working-directory: packages/core
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: bun publish
        working-directory: packages/adapters/hono
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
